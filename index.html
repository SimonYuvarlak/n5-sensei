<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SUKISEN</title>
<style>
  :root { --paper:#f4efe6; --ink:#1c1814; --mute:#6e665c; --line:#ddd4c6; --accent:#9c3b2e; --card:#fffaf2; }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; background:var(--paper); color:var(--ink); font-family: "Iowan Old Style", Palatino, "Times New Roman", serif; }
  .wrap { max-width: 42rem; margin: 0 auto; padding: 1.5rem 1.1rem 3rem; }
  header { display:flex; justify-content:space-between; align-items:baseline; gap:1rem; margin-bottom:1.4rem; }
  h1 { font-size:1.35rem; font-weight:600; letter-spacing:.02em; margin:0; }
  .sub { color:var(--mute); font-size:.85rem; }
  .cats { display:flex; flex-wrap:wrap; gap:.45rem; margin-bottom:1.2rem; }
  .cats button, .tools button { border:1px solid var(--line); background:transparent; color:var(--ink); padding:.35rem .7rem; border-radius:999px; font: inherit; font-size:.8rem; cursor:pointer; }
  .cats button.on, .tools button.on { background:var(--ink); color:var(--paper); border-color:var(--ink); }
  .card { background:var(--card); border:1px solid var(--line); border-radius:1.1rem; min-height:15rem; padding:1.6rem 1.4rem; display:flex; flex-direction:column; justify-content:center; align-items:center; text-align:center; cursor:pointer; box-shadow: 0 10px 30px rgba(28,24,20,.06); }
  .meta { color:var(--mute); font-size:.75rem; letter-spacing:.08em; text-transform:uppercase; margin-bottom:.8rem; }
  .word { font-size: clamp(1.8rem, 6vw, 2.7rem); line-height:1.2; }
  .hint { margin-top:1.1rem; color:var(--mute); font-size:.8rem; }
  .grade { display:flex; gap:.7rem; margin-top:1rem; }
  .grade button { flex:1; padding:.8rem; border-radius:.7rem; border:1px solid var(--line); background:var(--card); font:inherit; cursor:pointer; }
  .grade .knew { background:var(--ink); color:var(--paper); border-color:var(--ink); }
  .tools { display:flex; gap:.45rem; flex-wrap:wrap; margin:1rem 0; }
  .bar { height:4px; background:var(--line); border-radius:99px; overflow:hidden; margin: .6rem 0 1rem; }
  .bar > span { display:block; height:100%; background:var(--accent); width:0; }
  .counts { color:var(--mute); font-size:.85rem; }
  .nav { display:flex; gap:.45rem; margin-bottom:1rem; }
  .nav a { border:1px solid var(--line); color:var(--ink); text-decoration:none; padding:.35rem .7rem; border-radius:999px; font-size:.8rem; }
  .nav a.on { background:var(--ink); color:var(--paper); border-color:var(--ink); }
</style>
</head>
<body>
<div class="wrap">
  <div class="nav">
    <a class="on" href="index.html">Kartlar</a>
    <a href="notes.html">Notlar</a>
  </div>
  <header>
    <div>
      <h1>SUKISEN</h1>
      <div class="sub">127 kart · Apple Notes kelimeleri</div>
    </div>
    <div class="counts" id="counts"></div>
  </header>
  <div class="cats" id="cats"></div>
  <div class="tools">
    <button id="dir">JP → TR</button>
    <button id="shuffle">Karıştır</button>
    <button id="reset">Sıfırla</button>
  </div>
  <div class="bar"><span id="bar"></span></div>
  <div class="card" id="card" tabindex="0">
    <div class="meta" id="meta"></div>
    <div class="word" id="word"></div>
    <div class="hint" id="hint">Çevirmek için dokun / Space</div>
  </div>
  <div class="grade">
    <button id="again">Again</button>
    <button class="knew" id="knew">Knew it</button>
  </div>
</div>
<script>
const CARDS = [{"front": "ikimasu", "back": "gitmek", "tag": "Verbs"}, {"front": "kimasu", "back": "gelmek", "tag": "Verbs"}, {"front": "kimashita", "back": "geldi", "tag": "Verbs"}, {"front": "kaerimasu", "back": "dönmek, eve dönmek (+ ni)", "tag": "Verbs"}, {"front": "kakimasu", "back": "yazmak", "tag": "Verbs"}, {"front": "yomimasu", "back": "okumak", "tag": "Verbs"}, {"front": "agemasu", "back": "vermek", "tag": "Verbs"}, {"front": "moraimasu", "back": "almak", "tag": "Verbs"}, {"front": "tsukaimasu", "back": "kullanmak", "tag": "Verbs"}, {"front": "shimasu", "back": "yapmak", "tag": "Verbs"}, {"front": "yarimasu", "back": "yapmak (= shimasu)", "tag": "Verbs"}, {"front": "iimasu", "back": "söylemek / demek", "tag": "Verbs"}, {"front": "iimashita", "back": "söyledi", "tag": "Verbs"}, {"front": "moushimasu", "back": "…diye söylerler (adım …dir)", "tag": "Verbs"}, {"front": "wakarimasu", "back": "anlamak (+ ga)", "tag": "Verbs"}, {"front": "wakarimasen", "back": "anlamamak", "tag": "Verbs"}, {"front": "shirimasu", "back": "bilmek (+ wo)", "tag": "Verbs"}, {"front": "shitteimasu", "back": "biliyorum", "tag": "Verbs"}, {"front": "shirimasen", "back": "bilmiyorum", "tag": "Verbs"}, {"front": "manabimasu", "back": "öğrenmek (+ wo)", "tag": "Verbs"}, {"front": "benkyou shimasu", "back": "ders çalışmak (+ wo)", "tag": "Verbs"}, {"front": "imasu", "back": "var olmak (canlı)", "tag": "Verbs"}, {"front": "arimasu", "back": "var olmak (cansız)", "tag": "Verbs"}, {"front": "ii", "back": "iyi", "tag": "Adjectives"}, {"front": "ii ne", "back": "iyi ya / beğenmek (internet)", "tag": "Adjectives"}, {"front": "suki", "back": "sevmek (sıfat)", "tag": "Adjectives"}, {"front": "dai suki", "back": "çok sevmek", "tag": "Adjectives"}, {"front": "kirai", "back": "nefret etmek (sıfat)", "tag": "Adjectives"}, {"front": "hoshii", "back": "istemek (sıfat)", "tag": "Adjectives"}, {"front": "watashi", "back": "ben", "tag": "People"}, {"front": "anata", "back": "sen", "tag": "People"}, {"front": "kare", "back": "o (erkek)", "tag": "People"}, {"front": "kanojo", "back": "o (kadın)", "tag": "People"}, {"front": "-tachi", "back": "çoğul, insanlar için", "tag": "People"}, {"front": "hito", "back": "kişi", "tag": "People"}, {"front": "minna", "back": "herkes", "tag": "People"}, {"front": "gakusei", "back": "öğrenci", "tag": "People"}, {"front": "ryuugakusei", "back": "uluslararası öğrenci", "tag": "People"}, {"front": "sensei", "back": "öğretmen", "tag": "People"}, {"front": "torukojin", "back": "Türk (kişi)", "tag": "People"}, {"front": "kyou", "back": "bugün", "tag": "Time"}, {"front": "kinou", "back": "dün", "tag": "Time"}, {"front": "ashita", "back": "yarın", "tag": "Time"}, {"front": "asa", "back": "sabah", "tag": "Time"}, {"front": "hiru", "back": "öğlen", "tag": "Time"}, {"front": "ban", "back": "akşam", "tag": "Time"}, {"front": "yoru", "back": "gece", "tag": "Time"}, {"front": "senshuu", "back": "geçen hafta", "tag": "Time"}, {"front": "konshuu", "back": "bu hafta", "tag": "Time"}, {"front": "raishuu", "back": "gelecek hafta", "tag": "Time"}, {"front": "sakunen", "back": "geçen yıl", "tag": "Time"}, {"front": "kotoshi", "back": "bu yıl", "tag": "Time"}, {"front": "rainen", "back": "gelecek yıl", "tag": "Time"}, {"front": "kako", "back": "geçmiş", "tag": "Time"}, {"front": "genzai", "back": "şimdi", "tag": "Time"}, {"front": "mirai", "back": "gelecek", "tag": "Time"}, {"front": "natsu", "back": "yaz", "tag": "Time"}, {"front": "-ji", "back": "saat (o’clock)", "tag": "Time"}, {"front": "jikan", "back": "saat / zaman", "tag": "Time"}, {"front": "nihon", "back": "Japonya", "tag": "Place"}, {"front": "toruko", "back": "Türkiye", "tag": "Place"}, {"front": "tokyo", "back": "Tokyo", "tag": "Place"}, {"front": "istanbul", "back": "İstanbul", "tag": "Place"}, {"front": "gakkou", "back": "okul", "tag": "Place"}, {"front": "ie", "back": "ev", "tag": "Place"}, {"front": "mise", "back": "dükkan", "tag": "Place"}, {"front": "ginkou", "back": "banka", "tag": "Place"}, {"front": "pen", "back": "kalem", "tag": "Things"}, {"front": "no-to", "back": "not defteri", "tag": "Things"}, {"front": "shukudai", "back": "ödev", "tag": "Things"}, {"front": "hon", "back": "kitap", "tag": "Things"}, {"front": "basu", "back": "otobüs", "tag": "Things"}, {"front": "kuruma", "back": "araba", "tag": "Things"}, {"front": "sushi", "back": "suşi", "tag": "Things"}, {"front": "pakuchi", "back": "kişniş", "tag": "Things"}, {"front": "tabemono", "back": "yemek", "tag": "Things"}, {"front": "kore", "back": "bu", "tag": "This / that"}, {"front": "sore", "back": "o (near you)", "tag": "This / that"}, {"front": "are", "back": "şu", "tag": "This / that"}, {"front": "kono", "back": "bu + noun", "tag": "This / that"}, {"front": "sono", "back": "o + noun", "tag": "This / that"}, {"front": "ano", "back": "şu + noun", "tag": "This / that"}, {"front": "koko", "back": "burası", "tag": "This / that"}, {"front": "soko", "back": "orası", "tag": "This / that"}, {"front": "asoko", "back": "şurası", "tag": "This / that"}, {"front": "hajimemashite", "back": "memnun oldum / selamlar (tanışırken)", "tag": "Greetings"}, {"front": "ohayou (gozaimasu)", "back": "günaydın", "tag": "Greetings"}, {"front": "konnichiwa", "back": "merhaba", "tag": "Greetings"}, {"front": "konbanwa", "back": "iyi akşamlar", "tag": "Greetings"}, {"front": "oyasumi (nasai)", "back": "iyi geceler", "tag": "Greetings"}, {"front": "otsukaresama", "back": "kolay gelsin", "tag": "Greetings"}, {"front": "hai", "back": "evet", "tag": "Greetings"}, {"front": "iie", "back": "hayır", "tag": "Greetings"}, {"front": "iya", "back": "hayır (daha günlük)", "tag": "Greetings"}, {"front": "nani", "back": "ne", "tag": "Question words"}, {"front": "dare", "back": "kim", "tag": "Question words"}, {"front": "donata", "back": "kim (kibar)", "tag": "Question words"}, {"front": "itsu", "back": "ne zaman", "tag": "Question words"}, {"front": "itsu kara", "back": "ne zamandan beri", "tag": "Question words"}, {"front": "doko", "back": "nere", "tag": "Question words"}, {"front": "naze", "back": "neden", "tag": "Question words"}, {"front": "nanji", "back": "saat kaç", "tag": "Question words"}, {"front": "dou", "back": "nasıl", "tag": "Question words"}, {"front": "dou yatte", "back": "ne şekilde (arkasından fiil gelince)", "tag": "Question words"}, {"front": "-go", "back": "dil eki (-ce / -ca)", "tag": "Language"}, {"front": "torukogo", "back": "Türkçe", "tag": "Language"}, {"front": "nihongo", "back": "Japonca", "tag": "Language"}, {"front": "eigo", "back": "İngilizce", "tag": "Language"}, {"front": "demo", "back": "fakat", "tag": "Connectors"}, {"front": "shikashi", "back": "fakat", "tag": "Connectors"}, {"front": "soshite", "back": "and then / sonrasında", "tag": "Connectors"}, {"front": "naze nara", "back": "çünkü (naze’nin cevabı)", "tag": "Connectors"}, {"front": "wa", "back": "topic", "tag": "Particles"}, {"front": "ga", "back": "vurgu; suki / kirai / hoshii / wakarimasu / imasu / arimasu", "tag": "Particles"}, {"front": "wo", "back": "object (belirtme)", "tag": "Particles"}, {"front": "ni", "back": "yönelme; imasu/arimasu ile yer", "tag": "Particles"}, {"front": "he", "back": "fiziksel yön (okunuşu: e)", "tag": "Particles"}, {"front": "no", "back": "…nin (possession / of)", "tag": "Particles"}, {"front": "no koto", "back": "kişi + suki (X no koto ga suki)", "tag": "Particles"}, {"front": "de", "back": "-de / -da, ile (yer veya araç)", "tag": "Particles"}, {"front": "to", "back": "ile / ve / diye", "tag": "Particles"}, {"front": "to issho ni", "back": "birlikte", "tag": "Particles"}, {"front": "ka", "back": "mi? (soru)", "tag": "Particles"}, {"front": "kara", "back": "…den (from)", "tag": "Particles"}, {"front": "made", "back": "…e kadar (until)", "tag": "Particles"}, {"front": "ja arimasen", "back": "değildir", "tag": "Particles"}, {"front": "de wa arimasen", "back": "değildir (daha resmi)", "tag": "Particles"}];
const KEY = "sukisen-local";
let cat = "All";
let dir = "jp-tr";
let flipped = false;
let queue = [];
const state = JSON.parse(localStorage.getItem(KEY) || localStorage.getItem("n5-sensei-local") || '{"known":[]}');
const cats = ["All", ...Array.from(new Set(CARDS.map(c => c.tag)))];
const $ = id => document.getElementById(id);
function save(){ localStorage.setItem(KEY, JSON.stringify(state)); }
function pool(){
  return CARDS.filter(c => (cat==="All" || c.tag===cat) && !state.known.includes(c.front+"|"+c.tag));
}
function rebuild(shuffle=true){
  queue = pool();
  if (shuffle) queue.sort(() => Math.random()-0.5);
  flipped = false;
  render();
}
function renderCats(){
  $("cats").innerHTML = cats.map(c => `<button data-c="${c}" class="${c===cat?'on':''}">${c}</button>`).join("");
}
function current(){ return queue[0]; }
function prompt(c){ return dir==="jp-tr" ? c.front : c.back; }
function answer(c){ return dir==="jp-tr" ? c.back : c.front; }
function render(){
  renderCats();
  const total = (cat==="All"?CARDS:CARDS.filter(c=>c.tag===cat)).length;
  const known = state.known.filter(k => cat==="All" || k.endsWith("|"+cat)).length;
  $("counts").textContent = `${known} / ${total} known`;
  $("bar").style.width = (total? (known/total*100):0) + "%";
  $("dir").textContent = dir==="jp-tr" ? "JP → TR" : "TR → JP";
  const c = current();
  if (!c){
    $("meta").textContent = cat;
    $("word").textContent = "Bu sette bitti.";
    $("hint").textContent = "Reset veya başka kategori.";
    return;
  }
  $("meta").textContent = (flipped ? (dir==="jp-tr"?"Türkçe":"Rōmaji") : (dir==="jp-tr"?"Rōmaji":"Türkçe")) + " · " + c.tag;
  $("word").textContent = flipped ? answer(c) : prompt(c);
  $("hint").textContent = flipped ? (dir==="jp-tr"?c.front:c.back) : "Çevirmek için dokun / Space";
}
$("card").onclick = () => { if(current()){ flipped=!flipped; render(); } };
$("knew").onclick = () => {
  const c=current(); if(!c||!flipped) return;
  state.known.push(c.front+"|"+c.tag); save(); queue.shift(); flipped=false; render();
};
$("again").onclick = () => {
  const c=current(); if(!c||!flipped) return;
  queue.push(queue.shift()); flipped=false; render();
};
$("cats").onclick = e => { const b=e.target.closest("button"); if(!b) return; cat=b.dataset.c; rebuild(); };
$("dir").onclick = () => { dir = dir==="jp-tr"?"tr-jp":"jp-tr"; flipped=false; render(); };
$("shuffle").onclick = () => rebuild(true);
$("reset").onclick = () => { if(confirm("İlerlemeyi sil?")){ state.known=[]; save(); rebuild(); } };
document.addEventListener("keydown", e => {
  if(e.key===" "){ e.preventDefault(); if(current()){ flipped=!flipped; render(); } }
  if(!flipped) return;
  if(e.key==="ArrowRight"||e.key==="2") $("knew").click();
  if(e.key==="ArrowLeft"||e.key==="1") $("again").click();
});
rebuild();
</script>
</body>
</html>
