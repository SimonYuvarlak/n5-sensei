<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;0,6..72,700;1,6..72,400;1,6..72,600&display=swap" rel="stylesheet">
<title>SUKISEN — Cümleler</title>
<style>
  :root { --paper:#f4efe6; --ink:#1c1814; --mute:#6e665c; --line:#ddd4c6; --accent:#9c3b2e; --card:#fffaf2; }
  * { box-sizing: border-box; }
  html { font-size: 19px; }
  body { margin:0; min-height:100vh; background:var(--paper); color:var(--ink); font-family: "Newsreader", Georgia, "Iowan Old Style", "Times New Roman", serif; font-optical-sizing: auto; font-size: 1.05rem; line-height: 1.5; }
  .wrap { max-width: 44rem; margin: 0 auto; padding: 1.6rem 1.2rem 3rem; }
  header { display:flex; justify-content:space-between; align-items:baseline; gap:1rem; margin-bottom:1.4rem; }
  h1 { font-size:1.85rem; font-weight:600; letter-spacing:.01em; margin:0; }
  .sub { color:var(--mute); font-size:1rem; }
  .cats { display:flex; flex-wrap:wrap; gap:.45rem; margin-bottom:1.2rem; }
  .cats button, .tools button { border:1px solid var(--line); background:transparent; color:var(--ink); padding:.4rem .8rem; border-radius:999px; font: inherit; font-size:.92rem; cursor:pointer; }
  .cats button.on, .tools button.on { background:var(--ink); color:var(--paper); border-color:var(--ink); }
  .card { background:var(--card); border:1px solid var(--line); border-radius:1.1rem; min-height:17rem; padding:1.8rem 1.5rem; display:flex; flex-direction:column; justify-content:center; align-items:center; text-align:center; cursor:pointer; box-shadow: 0 10px 30px rgba(28,24,20,.06); }
  .meta { color:var(--mute); font-size:.88rem; letter-spacing:.08em; text-transform:uppercase; margin-bottom:.8rem; }
  .word { font-size: clamp(2.3rem, 7vw, 3.4rem); line-height:1.2; }
  .hint { margin-top:1.1rem; color:var(--mute); font-size:.95rem; }
  .grade { display:flex; gap:.7rem; margin-top:1rem; }
  .grade button { flex:1; padding:.9rem; border-radius:.7rem; border:1px solid var(--line); background:var(--card); font:inherit; font-size:1.05rem; cursor:pointer; }
  .grade .knew { background:var(--ink); color:var(--paper); border-color:var(--ink); }
  .tools { display:flex; gap:.45rem; flex-wrap:wrap; margin:1rem 0; }
  .bar { height:4px; background:var(--line); border-radius:99px; overflow:hidden; margin: .6rem 0 1rem; }
  .bar > span { display:block; height:100%; background:var(--accent); width:0; }
  .counts { color:var(--mute); font-size:1rem; }
  .nav { display:flex; gap:.45rem; margin-bottom:1rem; }
  .nav a { border:1px solid var(--line); color:var(--ink); text-decoration:none; padding:.4rem .8rem; border-radius:999px; font-size:.92rem; }
  .nav a.on { background:var(--ink); color:var(--paper); border-color:var(--ink); }
  img.chart { max-width:100%; height:auto; display:block; margin:.8rem 0 1.2rem; border:1px solid var(--line); background:#fff; }
  #search { width:100%; font:inherit; font-size:1rem; padding:.55rem .75rem; border:1px solid var(--line); border-radius:.6rem; background:var(--card); color:var(--ink); margin: .2rem 0 1rem; }
  #vocab-list h3 { font-size:.82rem; letter-spacing:.1em; text-transform:uppercase; color:var(--accent); margin:1.15rem 0 .35rem; }
  #vocab-list .row { display:flex; justify-content:space-between; gap:1rem; padding:.42rem 0; border-bottom:1px solid var(--line); }
  #vocab-list .jp { font-weight:600; }
  #vocab-list .tr { color:var(--mute); text-align:right; }
  #vocab-list .row.known { opacity:.42; }
  #vocab-list .empty { color:var(--mute); }
  .card.sentence .word { font-size: clamp(1.15rem, 3.5vw, 1.75rem); line-height:1.4; }

  .topbar { position:sticky; top:0; z-index:50; display:flex; align-items:center; gap:.55rem; padding:.55rem 1rem; background:var(--paper); border-bottom:1px solid var(--line); }
  .topbar .brand { color:var(--ink); text-decoration:none; font-weight:600; letter-spacing:.02em; }
  .menu-btn { display:none; margin-left:auto; border:1px solid var(--line); background:var(--card); color:var(--ink); width:2.2rem; height:2.2rem; border-radius:.45rem; font:inherit; font-size:1.2rem; cursor:pointer; line-height:1; }
  .topnav { display:flex; flex-wrap:wrap; gap:.4rem; margin-left:auto; align-items:center; }
  .topnav a { border:1px solid var(--line); color:var(--ink); text-decoration:none; padding:.32rem .7rem; border-radius:999px; font-size:.85rem; }
  .topnav a.on { background:var(--ink); color:var(--paper); border-color:var(--ink); }
  .topnav .toc-block { display:none; width:100%; }
  .topnav .toc-block h2 { font-size:.72rem; letter-spacing:.12em; text-transform:uppercase; color:var(--mute); margin:.75rem 0 .4rem; font-weight:600; }
  .topnav .toc-block a { display:block; border:0; border-radius:.35rem; padding:.22rem .4rem; }
  @media (max-width: 860px) {
    .menu-btn { display:inline-flex; align-items:center; justify-content:center; }
    .topnav { display:none; position:absolute; left:0; right:0; top:100%; flex-direction:column; align-items:stretch; margin:0; padding:.55rem 1rem 1rem; background:var(--paper); border-bottom:1px solid var(--line); max-height:calc(100vh - 3.4rem); overflow:auto; }
    .topnav.open { display:flex; }
    .topnav .toc-block { display:block; }
    .outline { display:none !important; }
  }
</style>
</head>
<body>
<header class="topbar">
  <a class="brand" href="index.html">SUKISEN</a>
  <button type="button" class="menu-btn" id="menu-btn" aria-label="Menü" aria-expanded="false">☰</button>
  <nav class="topnav" id="topnav">
    <a href="index.html">Kelimeler</a>
    <a class="on" href="sentences.html">Cümleler</a>
    <a href="notes.html">Notlar</a>
    <a href="hiragana.html">Hiragana</a>
  </nav>
</header>
<div class="wrap">
  <header>
    <div>
      <h1>Cümleler</h1>
      <div class="sub">56 kart · ders örnekleri</div>
    </div>
    <div class="counts" id="counts"></div>
  </header>
  <div class="cats" id="cats"></div>
  <div class="tools">
    <button id="dir">JP → TR</button>
    <button id="mode">Liste</button>
    <button id="shuffle">Karıştır</button>
    <button id="reset">Sıfırla</button>
  </div>
  <div class="bar"><span id="bar"></span></div>
  <div class="card sentence" id="card" tabindex="0">
    <div class="meta" id="meta"></div>
    <div class="word" id="word"></div>
    <div class="hint" id="hint">Çevirmek için dokun / Space</div>
  </div>
  <div class="grade">
    <button id="again">Again</button>
    <button class="knew" id="knew">Knew it</button>
  </div>
  <div id="list-wrap" hidden>
    <input id="search" type="search" placeholder="Ara…" autocomplete="off">
    <div id="vocab-list"></div>
  </div>
</div>
<script>
const CARDS = [{"front": "pen wo tsukaimasu", "back": "kalemi kullanırım", "tag": "#1"}, {"front": "ashita no-to wo agemasu", "back": "yarın defteri vereceğim", "tag": "#1"}, {"front": "anata wa no-to wo moraimasu", "back": "sen defteri alacaksın", "tag": "#1"}, {"front": "watashi wa gakkou ni ikimasu", "back": "ben okula gideceğim", "tag": "#1"}, {"front": "anatatachi wa watashi ni shukudai wo agemasu", "back": "siz bana ödevi vereceksiniz", "tag": "#1"}, {"front": "kore wa pen desu", "back": "bu kalemdir", "tag": "#2"}, {"front": "kono pen wa ii pen desu", "back": "bu kalem iyi kalemdir", "tag": "#2"}, {"front": "kono hito wa Ahmet desu", "back": "bu kişi Ahmet’tir", "tag": "#2"}, {"front": "sono gakusei wa ii gakusei desu", "back": "o öğrenci iyi öğrencidir", "tag": "#2"}, {"front": "soko no mise wa kare no mise desu", "back": "oradaki dükkan onun dükkanıdır", "tag": "#2"}, {"front": "kanojo wa soko no mise ni ikimasu", "back": "o, oradaki dükkana gidecek", "tag": "#2"}, {"front": "anata wa gakkou de nihongo wo tsukaimasu", "back": "sen okulda Japonca’yı kullanıyorsun", "tag": "#2"}, {"front": "basu de ikimasu", "back": "otobüsle gideceğim", "tag": "#2"}, {"front": "watashi wa kare to issho ni ikimasu", "back": "onunla birlikte gideceğim", "tag": "#2"}, {"front": "kore wa nan desu ka", "back": "bu nedir?", "tag": "#2"}, {"front": "asa kara ban made yarimasu", "back": "sabahtan akşama kadar yapacağım", "tag": "#2"}, {"front": "watashi wa sushi ga suki desu", "back": "suşi severim", "tag": "#3"}, {"front": "anata wa nihongo ga wakarimasu ka", "back": "sen Japonca’yı anlıyor musun?", "tag": "#3"}, {"front": "anata wa ginkou ga hoshii desu ka", "back": "sen banka istiyor musun?", "tag": "#3"}, {"front": "ie ni dou yatte kaerimasu ka", "back": "eve nasıl gideceksin?", "tag": "#3"}, {"front": "pen ga Istanbul ni arimasu", "back": "kalem İstanbul’dadır", "tag": "#3"}, {"front": "sensei ga Istanbul ni imasu", "back": "öğretmen İstanbul’dadır", "tag": "#3"}, {"front": "sore wo dou yatte kakimasu ka", "back": "onu nasıl yazacaksın", "tag": "#4"}, {"front": "anata wa sore wo dou yatte kakimasu ka", "back": "sen onu nasıl yazacaksın", "tag": "#4"}, {"front": "kare wa “anata wa sore wo dou yatte yomimasu ka” to iimashita", "back": "o, onu nasıl okursun diye söyledi", "tag": "#4"}, {"front": "kanojo wa “anata wa sore wo dou yatte yomimasu ka” to iimashita ka", "back": "o, “sen onu nasıl okuyacaksın” diye söyledi mi?", "tag": "#4"}, {"front": "kare wa gakusei desu", "back": "o (erkek) öğrencidir", "tag": "#4"}, {"front": "kare wa gakusei desu demo sensei de wa arimasen", "back": "o öğrencidir ama öğretmen değildir", "tag": "#4"}, {"front": "kore wa hon desu shikashi kuruma de wa arimasen", "back": "bu kitaptır ama araba değildir", "tag": "#4"}, {"front": "iie, kono sensei wa sensei de wa arimasen", "back": "hayır, bu öğretmen öğretmen değildir", "tag": "#4"}, {"front": "sensei to gakusei wa doko ni ikimasu ka shitteimasu ka", "back": "hoca ile öğrenci nereye gidecek, biliyor musun?", "tag": "#5"}, {"front": "anata wa nanji ni kare wa tokyo kara istanbul ni kimasu ka shitteimasu ka", "back": "saat kaçta Tokyo’dan İstanbul’a gelecek, biliyor musun?", "tag": "#5"}, {"front": "watashi wa nihongo ga wakarimasen", "back": "ben Japonca anlamıyorum", "tag": "#5"}, {"front": "watashi wa eigo ga wakarimasen", "back": "ben İngilizce anlamıyorum", "tag": "#5"}, {"front": "gakusei wa gakkou ni imasu", "back": "öğrenci okulda", "tag": "#6"}, {"front": "watashi wa ima kuruma ni imasu", "back": "ben şimdi arabadayım", "tag": "#6"}, {"front": "watashi wa ima kuruma ni imasen", "back": "ben şimdi arabada değilim", "tag": "#6"}, {"front": "pen wa tsukue no ue ni arimasu", "back": "kalem masanın üstünde", "tag": "#6"}, {"front": "no-to wa tsukue no shita ni arimasu", "back": "not defteri masanın altında", "tag": "#6"}, {"front": "hon wa gakkou no naka ni arimasu", "back": "kitap okulun içinde", "tag": "#6"}, {"front": "kuruma wa ima Osaka ni arimasen", "back": "araba şu an Osaka’da değil", "tag": "#6"}, {"front": "basu wa doko ni arimasu ka", "back": "otobüs nerede?", "tag": "#6"}, {"front": "Sono kotoba no imi ni tsuite nani mo shirimasen", "back": "o kelimenin manası hakkında hiçbir şey (nanimo) bilmiyorum", "tag": "#7"}, {"front": "Kyoushitsu no mae kara kyoushitsu ni hairimasu, soshite kyoushitsu no ushiro kara demasu", "back": "sınıfın önünden sınıfa gireceğim sonra sınıfın arkasından çıkacağım", "tag": "#7"}, {"front": "Jibun no tame ni nihongo wo benkyou shimasu", "back": "kendim için japonca çalışıyorum", "tag": "#7"}, {"front": "Arda no tame ni no-to ni kakimasu", "back": "Arda için not defterine yazıyorum", "tag": "#7"}, {"front": "Gakkou ni ikimashita kara nihongo wo manabimashita", "back": "okula gittiğim için japonca öğrendim", "tag": "#7"}, {"front": "kore wa pen desu kara kakimasu", "back": "bu kalem olduğu için yazarım", "tag": "#7"}, {"front": "no-to ni kakimasu kara isogashii desu", "back": "deftere yazacağım için meşgulüm", "tag": "#7"}, {"front": "Ramazan desu kara tabemono tabemasen", "back": "Ramazan olduğu için yemek yemem", "tag": "#7"}, {"front": "Tabemasen kara nihongo wo benkyou shimasen", "back": "yemeyeceğim için japoncayı çalışmayacağım", "tag": "#7"}, {"front": "Ilgin no tame ni sushi wo tsukurimashita", "back": "Ilgin için sushi yaptım", "tag": "#7"}, {"front": "Arda no tame ni ryouri wo tsukurimashita", "back": "Arda için yemek yaptım", "tag": "#7"}, {"front": "Sensei no tame ni no-to kara keshimashita", "back": "hoca için not defterinden sildim", "tag": "#7"}, {"front": "Sensei wa gakuseitachi no tame ni jinja wo tsukurimashita", "back": "hoca öğrenci için tapınak yaptı", "tag": "#7"}, {"front": "Sensei wa gakuseitachi no tame ni kono kotoba ni tsuite rei wo agemashita", "back": "öğretmen öğrenciler için bu kelime ile ilgili örnek verdi", "tag": "#7"}];
const KEY = "sukisen-sentences";
let cat = "All";
let dir = "jp-tr";
let flipped = false;
let queue = [];
let mode = "cards";
const state = JSON.parse(localStorage.getItem(KEY) || localStorage.getItem("n5-sensei-local") || '{"known":[]}');
const cats = ["All", ...Array.from(new Set(CARDS.map(c => c.tag)))];
const $ = id => document.getElementById(id);
function save(){ localStorage.setItem(KEY, JSON.stringify(state)); }
function pool(){
  return CARDS.filter(c => (cat==="All" || c.tag===cat) && !state.known.includes(c.front+"|"+c.tag));
}
function rebuild(shuffle=true){
  queue = pool();
  if (shuffle) queue.sort(() => Math.random()-0.5);
  flipped = false;
  render();
}
function renderCats(){
  $("cats").innerHTML = cats.map(c => `<button data-c="${c}" class="${c===cat?'on':''}">${c}</button>`).join("");
}
function current(){ return queue[0]; }
function prompt(c){ return dir==="jp-tr" ? c.front : c.back; }
function answer(c){ return dir==="jp-tr" ? c.back : c.front; }
function escList(s){ return String(s||"").replace(/[&<>]/g, ch => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[ch])); }
function renderList(){
  const box = $("vocab-list");
  if (!box) return;
  const q = (($("search") && $("search").value) || "").trim().toLowerCase();
  const items = CARDS.filter(c => (cat==="All" || c.tag===cat) && (!q || c.front.toLowerCase().includes(q) || c.back.toLowerCase().includes(q)));
  let html = "";
  let last = null;
  for (const c of items) {
    if (c.tag !== last) { html += `<h3>${escList(c.tag)}</h3>`; last = c.tag; }
    const known = state.known.includes(c.front+"|"+c.tag);
    html += `<div class="row${known?" known":""}"><span class="jp">${escList(c.front)}</span><span class="tr">${escList(c.back)}</span></div>`;
  }
  box.innerHTML = html || "<p class='empty'>Eşleşme yok.</p>";
}
function syncMode(){
  const list = mode === "list";
  if ($("card")) $("card").hidden = list;
  if ($("grade")) $("grade").hidden = list;
  const bar = document.querySelector(".bar");
  if (bar) bar.hidden = list;
  if ($("shuffle")) $("shuffle").hidden = list;
  if ($("dir")) $("dir").hidden = list;
  if ($("list-wrap")) $("list-wrap").hidden = !list;
  if ($("mode")) {
    $("mode").textContent = list ? "Kartlar" : "Liste";
    $("mode").classList.toggle("on", list);
  }
  if (list) renderList();
}
function render(){
  renderCats();
  const total = (cat==="All"?CARDS:CARDS.filter(c=>c.tag===cat)).length;
  const known = state.known.filter(k => cat==="All" || k.endsWith("|"+cat)).length;
  $("counts").textContent = `${known} / ${total} known`;
  $("bar").style.width = (total? (known/total*100):0) + "%";
  $("dir").textContent = dir==="jp-tr" ? "JP \u2192 TR" : "TR \u2192 JP";
  const c = current();
  if (!c){
    $("meta").textContent = cat;
    $("word").textContent = "Bu set bitti.";
    $("hint").textContent = "Reset veya başka kategori.";
    syncMode();
    return;
  }
  $("meta").textContent = (flipped ? (dir==="jp-tr"?"Türkçe":"Japonca") : (dir==="jp-tr"?"Japonca":"Türkçe")) + " · " + c.tag;
  $("word").textContent = flipped ? answer(c) : prompt(c);
  $("hint").textContent = flipped ? (dir==="jp-tr"?c.front:c.back) : "Çevirmek için dokun / Space";
  syncMode();
}
$("card").onclick = () => { if(current()){ flipped=!flipped; render(); } };
$("knew").onclick = () => {
  const c=current(); if(!c) return;
  state.known.push(c.front+"|"+c.tag); save(); queue.shift(); flipped=false; render();
};
$("again").onclick = () => {
  const c=current(); if(!c) return;
  queue.push(queue.shift()); flipped=false; render();
};
$("cats").onclick = e => { const b=e.target.closest("button"); if(!b) return; cat=b.dataset.c; rebuild(); };
$("dir").onclick = () => { dir = dir==="jp-tr"?"tr-jp":"jp-tr"; flipped=false; render(); };
$("mode").onclick = () => { mode = mode==="cards"?"list":"cards"; syncMode(); };
$("search").addEventListener("input", renderList);
$("shuffle").onclick = () => rebuild(true);
$("reset").onclick = () => { if(confirm("İlerlemeyi sil?")){ state.known=[]; save(); rebuild(); } };
document.addEventListener("keydown", e => {
  if(mode==="list") return;
  if(e.target && e.target.closest && e.target.closest("textarea,input")) return;
  if(e.key===" "){ e.preventDefault(); if(current()){ flipped=!flipped; render(); } }
  if(e.key==="ArrowRight"||e.key==="2") $("knew").click();
  if(e.key==="ArrowLeft"||e.key==="1") $("again").click();
});
rebuild();

(function(){
  const btn = document.getElementById("menu-btn");
  const nav = document.getElementById("topnav");
  if (!btn || !nav) return;
  btn.onclick = () => {
    const open = nav.classList.toggle("open");
    btn.setAttribute("aria-expanded", open ? "true" : "false");
  };
  nav.querySelectorAll("a").forEach(a => a.addEventListener("click", () => {
    if (window.matchMedia("(max-width: 860px)").matches) {
      nav.classList.remove("open");
      btn.setAttribute("aria-expanded", "false");
    }
  }));
})();

</script>
</body>
</html>
